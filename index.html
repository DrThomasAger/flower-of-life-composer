<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flower of Life Composer</title>
<style>
  body { margin: 0; background: #0b0b0f; color: #eee; font-family: Georgia, serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
  h1 { font-weight: normal; font-size: 1.3em; letter-spacing: 0.12em; margin: 18px 0 6px; }
  #controls { display: flex; gap: 20px; align-items: center; margin: 10px 0 14px; flex-wrap: wrap; justify-content: center; }
  label { font-size: 0.95em; }
  input[type=range] { vertical-align: middle; }
  select { vertical-align: middle; }
  button { background: #1c1c26; color: #eee; border: 1px solid #444; border-radius: 6px; padding: 7px 16px; font-family: inherit; font-size: 0.95em; cursor: pointer; }
  button:hover { border-color: #999; }
  button.active { border-color: #cbb; background: #2a2438; }
  .group { display: flex; gap: 14px; align-items: center; border: 1px solid #2c2c38; border-radius: 10px; padding: 14px 16px 10px; position: relative; }
  .groupTitle { position: absolute; top: -9px; left: 12px; background: #0b0b0f; padding: 0 8px; font-size: 0.75em; letter-spacing: 0.14em; color: #998; text-transform: uppercase; }
  #modeSwitch { display: inline-flex; border: 1px solid #444; border-radius: 8px; overflow: hidden; }
  .segment { border: none; border-radius: 0; padding: 7px 18px; background: #1c1c26; }
  .segment + .segment { border-left: 1px solid #444; }
  .segment.active { background: #3a3050; color: #fff; }
  button:disabled { opacity: 0.35; cursor: default; }
  button:disabled:hover { border-color: #444; }
  #modeHint { font-size: 0.9em; color: #bba; margin: 2px 0 8px; min-height: 1.2em; }
  #growBtn { font-size: 1.25em; letter-spacing: 0.14em; padding: 14px 64px; margin: 12px 0 4px; border-radius: 10px; border-color: #666; }
  #stage { flex: 1; display: flex; align-items: center; justify-content: center; width: 100%; }
  svg#canvas { width: min(88vw, 72vh); height: min(88vw, 72vh); cursor: default; touch-action: none; }
  /* one glide for everything: same duration, same curve, camera included */
  #canvas circle { transition: r 0.5s cubic-bezier(.3,.7,.25,1), cx 0.5s cubic-bezier(.3,.7,.25,1), cy 0.5s cubic-bezier(.3,.7,.25,1), stroke-opacity 0.12s ease, stroke-width 0.15s ease; }
  #canvas clipPath rect { transition: x 0.5s cubic-bezier(.3,.7,.25,1), y 0.5s cubic-bezier(.3,.7,.25,1), width 0.5s cubic-bezier(.3,.7,.25,1), height 0.5s cubic-bezier(.3,.7,.25,1); }
  .no-anim #canvas circle, .no-anim #canvas clipPath rect { transition: none !important; }
  .big-pattern #canvas circle { transition: none !important; }
  @media (prefers-reduced-motion: reduce) {
    #canvas circle, #canvas clipPath rect { transition: none !important; }
    .eyeGlow { animation-duration: 0.01s !important; }
  }
  .eyeGlow { opacity: 0; animation: eyeGlow 1.6s ease-out forwards; filter: drop-shadow(0 0 14px #f0c24b); pointer-events: none; }
  @keyframes eyeGlow { 0% { opacity: 0; } 22% { opacity: 0.85; } 100% { opacity: 0; } }
  #stageName { color: #cbb; letter-spacing: 0.06em; min-width: 7.5em; display: inline-block; }
  #hint { font-size: 0.85em; color: #999; margin: 8px 0 16px; }
  #savePanel { position: fixed; inset: 0; background: rgba(5,5,10,0.7); display: none; align-items: center; justify-content: center; }
  #savePanel.open { display: flex; }
  #saveCard { background: #15151d; border: 1px solid #444; border-radius: 10px; padding: 22px 28px; min-width: 300px; }
  #saveCard h2 { font-weight: normal; font-size: 1.05em; margin: 0 0 12px; letter-spacing: 0.08em; }
  fieldset { border: 1px solid #333; border-radius: 6px; margin: 0 0 12px; padding: 8px 12px; }
  legend { font-size: 0.85em; color: #aaa; padding: 0 6px; }
  fieldset label { display: block; margin: 4px 0; cursor: pointer; }
  #saveActions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 6px; }
  .hidden { display: none !important; }
  @media (max-width: 700px) {
    h1 { font-size: 1.05em; margin: 12px 0 4px; }
    #controls { gap: 10px; margin: 6px 0 8px; padding: 0 8px; width: 100%; box-sizing: border-box; flex-direction: column; align-items: stretch; }
    .group { gap: 10px; padding: 12px 10px 8px; flex-wrap: wrap; justify-content: center; width: 100%; min-width: 0; box-sizing: border-box; }
    #stageName { min-width: 0; }
    input[type=range] { width: 32vw; }
    label, button { font-size: 0.88em; }
    .segment { padding: 7px 12px; }
    #growBtn { font-size: 1.05em; padding: 12px 36px; margin: 8px 0 4px; }
    #modeHint, #hint { padding: 0 12px; text-align: center; }
    svg#canvas { width: 96vw; height: 96vw; max-height: 62vh; }
  }
</style>
</head>
<body>
<h1>Flower of Life Composer</h1>
<div id="controls">
  <div class="group">
    <div class="groupTitle">Pattern</div>
    <label>Shape
      <select id="frame">
        <option value="circle" selected>Emblem &#9711;</option>
        <option value="square">Tiling &#9638;</option>
      </select>
    </label>
    <label id="growthWrap">Size <input type="range" id="growth" min="0" max="108" step="1" value="0"> <span id="stageName">One Circle</span></label>
    <label id="zoomWrap" class="hidden">Zoom <input type="range" id="zoom" min="1" max="6" step="1" value="2"> <span id="zoomVal">2</span></label>
    <label>Line thickness
      <select id="weight">
        <option value="light">Thin</option>
        <option value="regular" selected>Medium</option>
        <option value="bold">Thick</option>
      </select>
    </label>
    <label id="boundaryWrap"><input type="checkbox" id="boundary" checked> Outer border</label>
    <label>Line colour <input type="color" id="lineColor" value="#ffffff"></label>
    <label>Background <input type="color" id="bgColor" value="#000000"></label>
  </div>
  <div class="group">
    <div class="groupTitle">Editing</div>
    <div id="modeSwitch">
      <button id="modeErase" class="segment active">Erase</button>
      <button id="modePaint" class="segment">Paint</button>
      <button id="modeRepair" class="segment">Repair</button>
    </div>
    <button id="undoBtn">Undo</button>
    <button id="restoreAll">Bring everything back</button>
  </div>
  <div class="group">
    <div class="groupTitle">Save</div>
    <button id="save">Save as image (SVG)</button>
  </div>
</div>
<div id="modeHint">Click a circle to remove it &middot; click an empty place to bring it back</div>
<div id="stage"><svg id="canvas" xmlns="http://www.w3.org/2000/svg"></svg></div>
<button id="growBtn">Add next circle</button>
<div id="hint">&larr; smaller &middot; &rarr; bigger &middot; Ctrl+Z undoes</div>

<div id="savePanel">
  <div id="saveCard">
    <h2>Save your composition</h2>
    <fieldset>
      <legend>Variant</legend>
      <label><input type="radio" name="variant" value="ground" checked> Your colours, with the background</label>
      <label><input type="radio" name="variant" value="transparent"> Your line colour, transparent background</label>
    </fieldset>
    <div id="saveActions">
      <button id="saveCancel">Cancel</button>
      <button id="saveGo">Download</button>
    </div>
  </div>
</div>

<script>
// ---------- model ----------
const R = 100;
const S = Math.sqrt(3) / 2 * R;
const WEIGHTS = { light: 0.008, regular: 0.014, bold: 0.024 };
const STAGE_NAMES = ['One Circle', 'Vesica Piscis', 'Three Circles', 'Four Circles', 'Five Circles', 'Six Circles', 'Seed of Life', 'Flower of Life', 'Full Flower', 'Four Rings', 'Five Rings', 'Six Rings', 'Seven Rings'];
const RING_ORDER = [[1, 0], [0, 1], [-1, 1], [-1, 0], [0, -1], [1, -1]]; // one circle at a time around the center
const MOST_GROWTH = 108; // past Seven Rings the stages name themselves by ring count
function stageName(g) { return STAGE_NAMES[g] || `${g - 5} Rings`; }
const state = {
  frame: 'circle',      // 'circle' | 'square'
  growth: 0,            // 0 one circle, 1 vesica piscis, 2 seed, 3 flower(19), 4 full flower, then outward
  zoom: 2,              // square frame: half-width = zoom * R * 1.5
  removed: new Set(),   // "i,j" keys, durable intent
  boundary: true,
  weight: 'regular',
  lineColor: '#ffffff',
  bgColor: '#000000',
  restoreMode: false,  // reveal all removed circles faintly; only they respond, ends itself when all have returned
  revealMode: false,   // canvas emptied; each click brings one circle into presence, revealed ones are settled
};
const history = [];
let hoverKey = null;
let exportCounter = 0;

function hexLattice(rings) {
  const pts = [];
  const maxK = rings * rings;
  const lim = Math.ceil(rings * 2 / Math.sqrt(3)) + 1; // the disk reaches past ±rings along each axis
  for (let i = -lim; i <= lim; i++)
    for (let j = -lim; j <= lim; j++)
      if (i * i + i * j + j * j <= maxK) pts.push([i, j]);
  return pts;
}
function centerOf(i, j) { return [j * S, i * R + j * R / 2]; } // vertical axis: the traditional orientation

function currentLattice(st) {
  let pts;
  if (st.frame === 'square') {
    const half = st.zoom * R * 1.5;
    pts = [];
    const range = Math.ceil((half + R) / S) + 2;
    for (let i = -2 * range; i <= 2 * range; i++)
      for (let j = -range; j <= range; j++) {
        const [x, y] = centerOf(i, j);
        if (Math.abs(x) <= half + R && Math.abs(y) <= half + R) pts.push([i, j]);
      }
  } else if (st.growth <= 5) pts = [[0, 0]].concat(RING_ORDER.slice(0, st.growth));
  else pts = hexLattice(st.growth - 5);
  // construction order: distance from origin, then angle
  return pts.sort((a, b) => {
    const [ax, ay] = centerOf(a[0], a[1]), [bx, by] = centerOf(b[0], b[1]);
    const da = Math.hypot(ax, ay), db = Math.hypot(bx, by);
    return (da - db) || (Math.atan2(ay, ax) - Math.atan2(by, bx));
  });
}

function metrics(st) {
  if (st.frame === 'square') {
    const half = st.zoom * R * 1.5;
    const stroke = Math.max(Math.max(half, 250) * WEIGHTS[st.weight], 3);
    return { mode: 'square', half, cx: 0, cy: 0, stroke, viewHalf: half };
  }
  if (st.growth <= 6) {
    // construction stages: no enclosure, the frame centers on the figure drawn so far (as in the classical step images)
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    for (const [i, j] of [[0, 0]].concat(RING_ORDER.slice(0, st.growth))) {
      const [x, y] = centerOf(i, j);
      minX = Math.min(minX, x - R); maxX = Math.max(maxX, x + R);
      minY = Math.min(minY, y - R); maxY = Math.max(maxY, y + R);
    }
    const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
    const half = Math.max(maxX - minX, maxY - minY) / 2 + 14;
    const stroke = Math.max(Math.max(half, 250) * WEIGHTS[st.weight], 3);
    return { mode: 'circle', construction: true, clipR: 4000, cx, cy, stroke, gap: 0, outerR: 0, viewHalf: half + stroke * 2 };
  }
  let clipR, cx = 0, cy = 0;
  if (st.growth === 7) clipR = 3 * R;              // flower of life: nineteen whole circles
  else clipR = (st.growth - 5) * R;                // full flower onward: boundary arcs begin
  // stroke growth rests at the Seven Rings measure, so vast patterns stay lace, not mass
  const stroke = Math.max(Math.max(Math.min(clipR, 7 * R), 250) * WEIGHTS[st.weight], 3);
  const gap = stroke * 3;
  const outerR = clipR + gap + stroke;
  const viewHalf = (st.boundary ? outerR : clipR) + stroke * 2 + 6;
  return { mode: 'circle', clipR, cx, cy, stroke, gap, outerR, viewHalf };
}

// ---------- render: persistent elements, animated reconciliation ----------
const svg = document.getElementById('canvas');
const ns = 'http://www.w3.org/2000/svg';
const circleEls = new Map();   // key -> element (pattern circles)
let dying = new Map();         // key -> removal timer

// static scaffolding
svg.innerHTML = `
  <rect id="bgRect" x="-4000" y="-4000" width="8000" height="8000" fill="#000000"/>
  <defs>
    <clipPath id="clipCircle"><circle cx="0" cy="0" r="300"/></clipPath>
    <clipPath id="clipSquare"><rect x="-300" y="-300" width="600" height="600"/></clipPath>
  </defs>
  <g id="pattern" fill="none"></g>
  <circle id="bInner" cx="0" cy="0" r="0" fill="none" stroke="#ffffff" stroke-opacity="0"/>
  <circle id="bOuter" cx="0" cy="0" r="0" fill="none" stroke="#ffffff" stroke-opacity="0"/>`;
const patternG = document.getElementById('pattern');
const clipCircleEl = document.querySelector('#clipCircle circle');
const clipSquareEl = document.querySelector('#clipSquare rect');
const bInner = document.getElementById('bInner');
const bOuter = document.getElementById('bOuter');

// viewBox tween
let view = { cx: 0, cy: 0, half: 400 };
let viewAnim = null;
function applyView() {
  svg.setAttribute('viewBox', `${(view.cx - view.half).toFixed(1)} ${(view.cy - view.half).toFixed(1)} ${(2 * view.half).toFixed(1)} ${(2 * view.half).toFixed(1)}`);
}
let viewTarget = { cx: NaN, cy: NaN, half: NaN };
let manualView = false; // a hand-held camera stays where it is put until growth hands it back
function freeCamera() {
  manualView = false;
  viewTarget = { cx: NaN, cy: NaN, half: NaN };
}
function tweenView(cx, cy, half) {
  if (manualView) return; // the hand holds the camera
  if (cx === viewTarget.cx && cy === viewTarget.cy && half === viewTarget.half) return; // already there or on the way
  viewTarget = { cx, cy, half };
  if (viewAnim) cancelAnimationFrame(viewAnim);
  applyView();
  const from = { ...view }, dur = 500, t0 = performance.now();
  const ease = t => 1 - Math.pow(1 - t, 3);
  function step(now) {
    const t = Math.min((now - t0) / dur, 1), e = ease(t);
    view.cx = from.cx + (cx - from.cx) * e;
    view.cy = from.cy + (cy - from.cy) * e;
    view.half = from.half + (half - from.half) * e;
    applyView();
    if (t < 1) viewAnim = requestAnimationFrame(step);
  }
  viewAnim = requestAnimationFrame(step);
}

function reconcile() {
  const m = metrics(state);
  const lattice = currentLattice(state);
  const targetKeys = new Set(lattice.map(([i, j]) => i + ',' + j));
  // at thousands of circles the choreography steps aside so growth stays immediate
  const vast = lattice.length > 4000;
  document.body.classList.toggle('big-pattern', vast);

  tweenView(m.cx, m.cy, m.viewHalf);
  document.getElementById('bgRect').setAttribute('fill', state.bgColor);

  // clip
  if (m.mode === 'circle') {
    clipCircleEl.setAttribute('cx', m.cx);
    clipCircleEl.setAttribute('cy', m.cy);
    clipCircleEl.style.r = m.clipR + 'px';
    patternG.setAttribute('clip-path', 'url(#clipCircle)');
  } else {
    clipSquareEl.style.x = -m.half + 'px'; clipSquareEl.style.y = -m.half + 'px';
    clipSquareEl.style.width = 2 * m.half + 'px'; clipSquareEl.style.height = 2 * m.half + 'px';
    patternG.setAttribute('clip-path', 'url(#clipSquare)');
  }

  // boundary rings (circle frame only)
  const showB = m.mode === 'circle' && state.boundary && !m.construction;
  for (const [el, rr] of [[bInner, showB ? m.clipR + m.stroke / 2 : 0], [bOuter, showB ? m.outerR : 0]]) {
    el.setAttribute('cx', m.cx);
    el.setAttribute('cy', m.cy);
    el.style.r = Math.max(rr, 0) + 'px';
    el.setAttribute('stroke', state.lineColor);
    el.setAttribute('stroke-width', m.stroke.toFixed(2));
    el.setAttribute('stroke-opacity', showB ? 1 : 0);
  }

  // circles already present before this change — the pattern the new ones emerge from
  const existing = [];
  for (const [key] of circleEls) {
    if (dying.has(key)) continue;
    const [pi, pj] = key.split(',').map(Number);
    existing.push(centerOf(pi, pj));
  }
  function nearestExisting(x, y) {
    let best = null, bestD = Infinity;
    for (const [px, py] of existing) {
      const d = Math.hypot(x - px, y - py);
      if (d > 0.01 && d < bestD) { bestD = d; best = [px, py]; }
    }
    return best;
  }

  // appearing + persisting circles: new ones slide out from behind an existing circle
  const newcomers = lattice.filter(([i, j]) => !circleEls.has(i + ',' + j)).length;
  const appearStep = newcomers > 1 ? Math.min(400 / newcomers, 60) : 0; // the whole flight tells the order, however many come
  let appearIdx = 0;
  lattice.forEach(([i, j]) => {
    const key = i + ',' + j;
    let el = circleEls.get(key);
    const isRemoved = state.removed.has(key);
    const isHover = key === hoverKey;
    if (dying.has(key)) { clearTimeout(dying.get(key)); dying.delete(key); }
    if (!el) {
      el = document.createElementNS(ns, 'circle');
      const [x, y] = centerOf(i, j);
      el.setAttribute('stroke', '#ffffff');
      if (vast) {
        // arrive at once, already home
        el.style.cx = x.toFixed(2) + 'px';
        el.style.cy = y.toFixed(2) + 'px';
        el.style.r = R + 'px';
        patternG.appendChild(el);
        circleEls.set(key, el);
        el.setAttribute('stroke', state.lineColor);
        el.setAttribute('stroke-width', m.stroke.toFixed(2));
        el.setAttribute('stroke-opacity', opacityFor(key));
        return;
      }
      const parent = nearestExisting(x, y);
      const delay = Math.round(appearIdx * appearStep);
      appearIdx++;
      if (parent) {
        // arrive from behind the nearest existing circle, already whole
        el.style.cx = parent[0].toFixed(2) + 'px';
        el.style.cy = parent[1].toFixed(2) + 'px';
        el.style.r = R + 'px';
        patternG.insertBefore(el, patternG.firstChild); // behind the pattern it emerges from
        void el.getBoundingClientRect();
        el.style.transitionDelay = `0ms, ${delay}ms, ${delay}ms, 0ms, 0ms`;
        el.style.cx = x.toFixed(2) + 'px';
        el.style.cy = y.toFixed(2) + 'px';
      } else {
        // the first circle: grow into being
        el.style.cx = x.toFixed(2) + 'px';
        el.style.cy = y.toFixed(2) + 'px';
        el.style.r = '0px';
        patternG.appendChild(el);
        void el.getBoundingClientRect();
        el.style.transitionDelay = `${delay}ms, 0ms, 0ms, 0ms, 0ms`;
        el.style.r = R + 'px';
      }
      circleEls.set(key, el);
      setTimeout(() => { el.style.transitionDelay = ''; }, delay + 550);
    } else {
      const [x, y] = centerOf(i, j);
      el.style.transition = '';      // release any withdrawal choreography
      el.style.cx = x.toFixed(2) + 'px';
      el.style.cy = y.toFixed(2) + 'px';
      el.style.r = R + 'px';
      el.style.strokeOpacity = ''; // revive if it was withdrawing
    }
    el.setAttribute('stroke', state.lineColor);
    el.setAttribute('stroke-width', m.stroke.toFixed(2));
    el.setAttribute('stroke-opacity', opacityFor(key));
  });
  updateModeAvailability();

  // withdrawing circles: unwind in reverse construction order, each gliding whole
  // into the nearest surviving circle and melting only as it merges
  const leaving = [];
  for (const [key, el] of circleEls) {
    if (targetKeys.has(key) || dying.has(key)) continue;
    const [pi, pj] = key.split(',').map(Number);
    const [x, y] = centerOf(pi, pj);
    leaving.push({ key, el, x, y, dist: Math.hypot(x, y) });
  }
  if (vast || leaving.length > 4000) {
    for (const { key, el } of leaving) { el.remove(); circleEls.delete(key); }
    return;
  }
  leaving.sort((a, b) => b.dist - a.dist); // outermost first: the construction unwinds
  const leaveStep = leaving.length > 1 ? Math.min(350 / leaving.length, 55) : 0;
  const curve = 'cubic-bezier(.3,.7,.25,1)';
  leaving.forEach(({ key, el, x, y }, rank) => {
    let home = null, homeD = Infinity;
    for (const [ti, tj] of lattice) {
      const [tx, ty] = centerOf(ti, tj);
      const d = Math.hypot(x - tx, y - ty);
      if (d < homeD) { homeD = d; home = [tx, ty]; }
    }
    const d = Math.round(rank * leaveStep);
    // travel the full 500ms visible; the fade occupies only the final stretch of the journey
    el.style.transition = `r 0.5s ${curve} ${d}ms, cx 0.5s ${curve} ${d}ms, cy 0.5s ${curve} ${d}ms, stroke-opacity 0.22s ease ${d + 300}ms, stroke-width 0.15s ease`;
    if (home) { el.style.cx = home[0].toFixed(2) + 'px'; el.style.cy = home[1].toFixed(2) + 'px'; }
    else el.style.r = '0px';
    el.style.strokeOpacity = '0';
    dying.set(key, setTimeout(() => {
      el.remove(); circleEls.delete(key); dying.delete(key);
    }, d + 560));
  });
}

// ---------- serialize (pure, still geometry, no animation) ----------
function serialize(st, variant) {
  const m = metrics(st);
  const color = st.lineColor;
  const clipId = `fol-clip-${++exportCounter}`;
  const half = m.viewHalf, cx = m.cx, cy = m.cy;
  const lines = [];
  lines.push('<?xml version="1.0" encoding="UTF-8"?>');
  lines.push(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${(cx - half).toFixed(1)} ${(cy - half).toFixed(1)} ${(2 * half).toFixed(1)} ${(2 * half).toFixed(1)}">`);
  if (variant === 'ground') lines.push(`  <rect x="${(cx - half).toFixed(1)}" y="${(cy - half).toFixed(1)}" width="${(2 * half).toFixed(1)}" height="${(2 * half).toFixed(1)}" fill="${st.bgColor}"/>`);
  if (m.mode === 'circle' && !m.construction) lines.push(`  <defs><clipPath id="${clipId}"><circle cx="${m.cx}" cy="${m.cy}" r="${m.clipR}"/></clipPath></defs>`);
  else if (m.mode === 'square') lines.push(`  <defs><clipPath id="${clipId}"><rect x="${-m.half}" y="${-m.half}" width="${2 * m.half}" height="${2 * m.half}"/></clipPath></defs>`);
  lines.push(m.construction
    ? `  <g fill="none" stroke="${color}" stroke-width="${m.stroke.toFixed(2)}">`
    : `  <g clip-path="url(#${clipId})" fill="none" stroke="${color}" stroke-width="${m.stroke.toFixed(2)}">`);
  for (const [i, j] of currentLattice(st)) {
    if (st.removed.has(i + ',' + j)) continue;
    const [x, y] = centerOf(i, j);
    lines.push(`    <circle cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r="${R}"/>`);
  }
  lines.push('  </g>');
  if (m.mode === 'circle' && st.boundary && !m.construction) {
    lines.push(`  <circle cx="${m.cx}" cy="${m.cy}" r="${(m.clipR + m.stroke / 2).toFixed(2)}" fill="none" stroke="${color}" stroke-width="${m.stroke.toFixed(2)}"/>`);
    lines.push(`  <circle cx="${m.cx}" cy="${m.cy}" r="${m.outerR.toFixed(2)}" fill="none" stroke="${color}" stroke-width="${m.stroke.toFixed(2)}"/>`);
  }
  lines.push('</svg>');
  return lines.join('\n');
}

// ---------- interaction ----------
// one place decides how bright any circle is, in every mode
function opacityFor(key) {
  const removed = state.removed.has(key), hover = key === hoverKey;
  if (state.restoreMode) return removed ? (hover ? 0.7 : 0.3) : 0.35;  // the pattern recedes, absences step forward
  if (state.revealMode) return removed ? (hover ? 0.55 : 0) : 1;       // hover shows plainly the circle about to appear
  return removed ? (hover ? 0.3 : 0) : (hover ? 0.65 : 1);             // solid at rest; hover softens the one you'd touch
}
function restyleKey(key) {
  const el = circleEls.get(key);
  if (el && !dying.has(key)) el.setAttribute('stroke-opacity', opacityFor(key));
}
function updateModeAvailability() {
  modeButtons.repair.disabled = state.removed.size === 0 && !state.restoreMode;
}
// the gold flush of a completed eye: the vesica lens between two neighboring circles
const NEIGHBOR_DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1], [1, -1], [-1, 1]];
function glowEye(ax, ay, bx, by) {
  const mx = (ax + bx) / 2, my = (ay + by) / 2;
  const dx = bx - ax, dy = by - ay, len = Math.hypot(dx, dy);
  const ux = -dy / len, uy = dx / len, h = Math.sqrt(Math.max(R * R - (len / 2) ** 2, 0));
  const p1 = [mx + ux * h, my + uy * h], p2 = [mx - ux * h, my - uy * h];
  const p = document.createElementNS(ns, 'path');
  p.setAttribute('d', `M ${p1[0].toFixed(2)} ${p1[1].toFixed(2)} A ${R} ${R} 0 0 1 ${p2[0].toFixed(2)} ${p2[1].toFixed(2)} A ${R} ${R} 0 0 1 ${p1[0].toFixed(2)} ${p1[1].toFixed(2)} Z`);
  p.setAttribute('fill', '#f0c24b');
  p.setAttribute('stroke', 'none');
  p.setAttribute('class', 'eyeGlow');
  patternG.appendChild(p);
  setTimeout(() => p.remove(), 1700);
}
function glowCompletedEyes(key) {
  const [i, j] = key.split(',').map(Number);
  const inLattice = new Set(currentLattice(state).map(([a, b]) => a + ',' + b));
  const [x, y] = centerOf(i, j);
  for (const [di, dj] of NEIGHBOR_DIRS) {
    const nk = (i + di) + ',' + (j + dj);
    if (!inLattice.has(nk) || state.removed.has(nk)) continue;
    const [nx, ny] = centerOf(i + di, j + dj);
    glowEye(x, y, nx, ny);
  }
}
function nearestKey(ev) {
  const pt = svg.createSVGPoint();
  pt.x = ev.clientX; pt.y = ev.clientY;
  const p = pt.matrixTransform(svg.getScreenCTM().inverse());
  let best = null, bestD = Infinity;
  for (const [i, j] of currentLattice(state)) {
    const key = i + ',' + j;
    if ((state.restoreMode || state.revealMode) && !state.removed.has(key)) continue; // only absences respond in these modes
    const [x, y] = centerOf(i, j);
    const d = Math.hypot(p.x - x, p.y - y);
    if (d < bestD) { bestD = d; best = key; }
  }
  // in Paint and Repair the reach is generous: no dead zones between settled circles
  const reach = (state.restoreMode || state.revealMode) ? R * 0.9 : R * 0.55;
  return bestD <= reach ? best : null;
}

// ---------- pan and zoom by hand ----------
let dragging = false, dragMoved = 0, lastClient = null;
function takeCamera() {
  manualView = true;
  if (viewAnim) { cancelAnimationFrame(viewAnim); viewAnim = null; }
}
svg.addEventListener('mousedown', (ev) => {
  if (ev.button !== 0) return;
  dragging = true; dragMoved = 0;
  lastClient = { x: ev.clientX, y: ev.clientY };
});
window.addEventListener('mousemove', (ev) => {
  if (!dragging) return;
  const dx = ev.clientX - lastClient.x, dy = ev.clientY - lastClient.y;
  lastClient = { x: ev.clientX, y: ev.clientY };
  dragMoved += Math.abs(dx) + Math.abs(dy);
  if (dragMoved < 4) return; // a still hand is a click, not a drag
  takeCamera();
  const scale = (2 * view.half) / svg.getBoundingClientRect().width;
  view.cx -= dx * scale;
  view.cy -= dy * scale;
  applyView();
});
window.addEventListener('mouseup', () => { dragging = false; });
svg.addEventListener('wheel', (ev) => {
  ev.preventDefault();
  takeCamera();
  const factor = Math.exp(ev.deltaY * 0.0011);
  const pt = svg.createSVGPoint();
  pt.x = ev.clientX; pt.y = ev.clientY;
  const p = pt.matrixTransform(svg.getScreenCTM().inverse());
  const half = Math.min(Math.max(view.half * factor, 33), 220000);
  const f = half / view.half;
  view.cx = p.x + (view.cx - p.x) * f;
  view.cy = p.y + (view.cy - p.y) * f;
  view.half = half;
  applyView();
}, { passive: false });

// touch: one finger travels, two fingers breathe the view larger and smaller, a tap chooses
let pinch = null; // { dist, mid: {x, y} } in client space
function toPattern(clientX, clientY) {
  const pt = svg.createSVGPoint();
  pt.x = clientX; pt.y = clientY;
  return pt.matrixTransform(svg.getScreenCTM().inverse());
}
svg.addEventListener('touchstart', (ev) => {
  if (ev.touches.length === 1) {
    dragging = true; dragMoved = 0; pinch = null;
    lastClient = { x: ev.touches[0].clientX, y: ev.touches[0].clientY };
  } else if (ev.touches.length === 2) {
    dragging = false;
    const [a, b] = ev.touches;
    pinch = { dist: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY),
              mid: { x: (a.clientX + b.clientX) / 2, y: (a.clientY + b.clientY) / 2 } };
  }
}, { passive: true });
svg.addEventListener('touchmove', (ev) => {
  if (pinch && ev.touches.length === 2) {
    ev.preventDefault();
    takeCamera();
    const [a, b] = ev.touches;
    const dist = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    const mid = { x: (a.clientX + b.clientX) / 2, y: (a.clientY + b.clientY) / 2 };
    const p = toPattern(mid.x, mid.y);
    const half = Math.min(Math.max(view.half * (pinch.dist / Math.max(dist, 1)), 33), 220000);
    const f = half / view.half;
    view.cx = p.x + (view.cx - p.x) * f;
    view.cy = p.y + (view.cy - p.y) * f;
    view.half = half;
    const scale = (2 * view.half) / svg.getBoundingClientRect().width;
    view.cx -= (mid.x - pinch.mid.x) * scale;
    view.cy -= (mid.y - pinch.mid.y) * scale;
    applyView();
    pinch = { dist, mid };
    dragMoved = 44; // the journey ends without touching a circle
    return;
  }
  if (dragging && ev.touches.length === 1) {
    const t = ev.touches[0];
    const dx = t.clientX - lastClient.x, dy = t.clientY - lastClient.y;
    lastClient = { x: t.clientX, y: t.clientY };
    dragMoved += Math.abs(dx) + Math.abs(dy);
    if (dragMoved < 4) return; // a still finger is a tap
    ev.preventDefault();
    takeCamera();
    const scale = (2 * view.half) / svg.getBoundingClientRect().width;
    view.cx -= dx * scale;
    view.cy -= dy * scale;
    applyView();
  }
}, { passive: false });
svg.addEventListener('touchend', (ev) => {
  if (ev.touches.length === 0) { dragging = false; pinch = null; }
  else if (ev.touches.length === 1) {
    pinch = null; dragging = true;
    lastClient = { x: ev.touches[0].clientX, y: ev.touches[0].clientY };
  }
}, { passive: true });

svg.addEventListener('mousemove', (ev) => {
  if (dragging && dragMoved >= 4) return; // travelling, not choosing
  const k = nearestKey(ev);
  svg.style.cursor = k ? 'pointer' : 'default'; // the hand appears only where a click means something
  if (k === hoverKey) return;
  const prev = hoverKey;
  hoverKey = k;
  if (prev) restyleKey(prev);   // touch only the two circles concerned — never the whole pattern
  if (k) restyleKey(k);
});
svg.addEventListener('mouseleave', () => {
  if (!hoverKey) return;
  const prev = hoverKey;
  hoverKey = null;
  restyleKey(prev);
});
svg.addEventListener('click', (ev) => {
  if (dragMoved >= 4) return; // the journey ends without touching a circle
  const k = nearestKey(ev);
  if (!k) return;
  if (state.removed.has(k)) {
    state.removed.delete(k);
    history.push({ key: k, action: 'restore' });
    if (state.revealMode) glowCompletedEyes(k); // painting a circle: every eye it completes flushes gold
  }
  else if (!state.restoreMode && !state.revealMode) { state.removed.add(k); history.push({ key: k, action: 'remove' }); }
  if (state.restoreMode && state.removed.size === 0) setMode('erase'); // all returned: the mode completes itself
  reconcile();
});
document.addEventListener('keydown', (ev) => {
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'z') {
    ev.preventDefault();
    undoOnce();
  }
});

const growthWrap = document.getElementById('growthWrap');
const zoomWrap = document.getElementById('zoomWrap');
const boundaryWrap = document.getElementById('boundaryWrap');

document.getElementById('frame').addEventListener('change', (ev) => {
  freeCamera();
  state.frame = ev.target.value;
  const sq = state.frame === 'square';
  growthWrap.classList.toggle('hidden', sq);
  zoomWrap.classList.toggle('hidden', !sq);
  boundaryWrap.classList.toggle('hidden', sq);
  document.getElementById('growBtn').textContent = sq ? 'Zoom in' : 'Add next circle';
  reconcile();
});
document.getElementById('growth').addEventListener('input', (ev) => {
  state.growth = parseInt(ev.target.value, 10);
  document.getElementById('stageName').textContent = stageName(state.growth);
  freeCamera();
  reconcile();
});
document.getElementById('zoom').addEventListener('input', (ev) => {
  freeCamera();
  state.zoom = parseInt(ev.target.value, 10);
  document.getElementById('zoomVal').textContent = state.zoom;
  reconcile();
});
document.getElementById('weight').addEventListener('change', (ev) => { state.weight = ev.target.value; reconcile(); });
document.getElementById('lineColor').addEventListener('input', (ev) => { state.lineColor = ev.target.value; reconcile(); });
document.getElementById('bgColor').addEventListener('input', (ev) => { state.bgColor = ev.target.value; reconcile(); });
document.getElementById('boundary').addEventListener('change', (ev) => { state.boundary = ev.target.checked; reconcile(); });
// editing modes: one three-way switch, always saying what a click does right now
const MODE_HINTS = {
  erase: 'Click a circle to remove it · click an empty place to bring it back',
  paint: 'The canvas is emptied — click to add circles one by one; added circles stay',
  repair: 'Everything removed is shown faintly — click one to bring it back',
};
const modeButtons = { erase: document.getElementById('modeErase'), paint: document.getElementById('modePaint'), repair: document.getElementById('modeRepair') };
function setMode(mode) {
  state.revealMode = mode === 'paint';
  state.restoreMode = mode === 'repair';
  for (const [name, btn] of Object.entries(modeButtons)) btn.classList.toggle('active', name === mode);
  document.getElementById('modeHint').textContent = MODE_HINTS[mode];
}
modeButtons.erase.addEventListener('click', () => { setMode('erase'); reconcile(); });
modeButtons.paint.addEventListener('click', () => {
  if (state.revealMode) return; // already painting
  history.push({ action: 'bulk', prev: [...state.removed] });  // one undo returns the whole prior composition
  for (const [i, j] of currentLattice(state)) state.removed.add(i + ',' + j); // empty the canvas
  setMode('paint');
  reconcile();
});
modeButtons.repair.addEventListener('click', () => {
  if (state.removed.size === 0) return; // nothing is absent
  setMode('repair');
  reconcile();
});
function undoOnce() {
  const last = history.pop();
  if (!last) return;
  if (last.action === 'bulk') { state.removed = new Set(last.prev); if (state.revealMode) setMode('erase'); }
  else if (last.action === 'remove') state.removed.delete(last.key);
  else state.removed.add(last.key);
  reconcile();
}
document.getElementById('undoBtn').addEventListener('click', undoOnce);
document.getElementById('restoreAll').addEventListener('click', () => {
  if (state.removed.size > 0) history.push({ action: 'bulk', prev: [...state.removed] });
  state.removed.clear();
  setMode('erase');
  reconcile();
});

// ---------- save flow ----------
const panel = document.getElementById('savePanel');
document.getElementById('save').addEventListener('click', () => { panel.classList.add('open'); });
document.getElementById('saveCancel').addEventListener('click', () => { panel.classList.remove('open'); });
document.getElementById('saveGo').addEventListener('click', () => {
  const variant = document.querySelector('input[name="variant"]:checked').value;
  const text = serialize(state, variant);
  const blob = new Blob([text], { type: 'image/svg+xml' });
  const a = document.createElement('a');
  const frameTag = state.frame === 'square' ? `square-z${state.zoom}` : stageName(state.growth).toLowerCase().replace(/ /g, '-');
  a.href = URL.createObjectURL(blob);
  a.download = `flower-of-life-${frameTag}-${state.weight}-${variant}.svg`;
  a.click();
  URL.revokeObjectURL(a.href);
  panel.classList.remove('open');
});

// growing and shrinking by one step: the big button and the arrow keys
function stepPattern(dir) {
  if (state.frame === 'square') {
    const z = Math.min(6, Math.max(1, state.zoom + dir));
    if (z === state.zoom) return;
    state.zoom = z;
    document.getElementById('zoom').value = z;
    document.getElementById('zoomVal').textContent = z;
  } else {
    const g = Math.min(MOST_GROWTH, Math.max(0, state.growth + dir));
    if (g === state.growth) return;
    state.growth = g;
    document.getElementById('growth').value = g;
    document.getElementById('stageName').textContent = stageName(g);
  }
  freeCamera();
  reconcile();
}
document.getElementById('growBtn').addEventListener('click', () => stepPattern(1));
document.addEventListener('keydown', (ev) => {
  if (ev.key === 'ArrowRight') { ev.preventDefault(); stepPattern(1); }
  if (ev.key === 'ArrowLeft') { ev.preventDefault(); stepPattern(-1); }
});

// URL options: ?still disables animation; ?frame=square opens in the square frame
const params = new URLSearchParams(location.search);
if (params.has('still')) document.body.classList.add('no-anim');
if (params.has('frame') && params.get('frame') === 'square') {
  state.frame = 'square';
  document.getElementById('frame').value = 'square';
  growthWrap.classList.add('hidden'); boundaryWrap.classList.add('hidden');
  zoomWrap.classList.remove('hidden');
  document.getElementById('growBtn').textContent = 'Zoom in';
}

// begin at one circle (or ?growth=N), ready to grow by hand
if (state.frame !== 'square') {
  let g = 0;
  if (params.has('growth')) g = Math.min(MOST_GROWTH, Math.max(0, parseInt(params.get('growth'), 10) || 0));
  state.growth = g;
  document.getElementById('growth').value = g;
  document.getElementById('stageName').textContent = stageName(g);
}
view = { cx: 0, cy: metrics(state).cy, half: metrics(state).viewHalf };
applyView();
reconcile();
</script>
</body>
</html>
